<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRL Contacts</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232f5fc5'/><text x='16' y='21' font-family='-apple-system,Segoe UI,sans-serif' font-size='11' font-weight='600' fill='white' text-anchor='middle'>TRL</text></svg>">
<!-- Bump the ?v= number on every deploy (here and on the four scripts below) so browsers
     fetch the new files instead of a cached copy. It must match APP_VERSION in app.js. -->
<link rel="stylesheet" href="styles.css?v=6">
</head>
<body>

<a class="skip" href="#record">Skip to content</a>

<!-- Sign in / create account / reset password -->
<div id="auth-screen" hidden>
  <div class="auth-card">
    <div class="auth-word">TRL Contacts</div>
    <div id="auth-body"></div>
  </div>
</div>

<!-- The app: rail, list, record, inspector -->
<div id="app" hidden>
  <nav id="rail" aria-label="Sections"></nav>
  <aside id="list" aria-label="List"></aside>
  <main id="record" tabindex="-1">
    <div class="loading">Loading</div>
  </main>
  <aside id="insp" aria-label="Details"></aside>
  <div id="scrim" hidden></div>
</div>

<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="live" class="sr-only" aria-live="polite"></div>

<script src="vendor/supabase.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="views.js?v=6"></script>
<script src="forms.js?v=6"></script>
<script src="export.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
